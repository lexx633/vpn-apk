name: Build & Release APK

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version name (e.g. 2.2.3.1). Must be > installed version for update to trigger.'
        required: true
        default: '2.2.3.1'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Restore the SAME debug keystore used in previous builds so upgrade installs work.
      # Secret DEBUG_KEYSTORE_BASE64: base64-encode ~/.android/debug.keystore and add as repo secret.
      - name: Restore debug keystore
        run: |
          mkdir -p ~/.android
          echo "${{ secrets.DEBUG_KEYSTORE_BASE64 }}" | base64 -d > ~/.android/debug.keystore

      # Secrets: LIMM_VLESS_UUID, LIMM_TOKEN, LIMM_REALITY_SID — add as repo secrets.
      - name: Write limm.properties
        run: |
          cat > V2rayNG/limm.properties <<'PROPS'
          LIMM_VLESS_UUID=${{ secrets.LIMM_VLESS_UUID }}
          LIMM_TOKEN=${{ secrets.LIMM_TOKEN }}
          LIMM_LABEL=mob
          LIMM_REALITY_SID=${{ secrets.LIMM_REALITY_SID }}
          PROPS

      - name: Set version in build.gradle.kts
        run: |
          sed -i 's/versionName = "[^"]*"/versionName = "${{ inputs.version }}"/' \
            V2rayNG/app/build.gradle.kts

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build APK (arm64-v8a)
        working-directory: V2rayNG
        run: ./gradlew :app:assemblePlaystoreDebug -PABI_FILTERS=arm64-v8a --no-daemon

      - name: Locate APK
        id: apk
        run: |
          APK=$(find V2rayNG/app/build/outputs/apk -name '*.apk' | head -1)
          echo "path=$APK" >> $GITHUB_OUTPUT
          echo "name=$(basename $APK)" >> $GITHUB_OUTPUT

      # GitHub release — APK прикреплён как asset (нужен для update checker).
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version }}
          name: limm VPN v${{ inputs.version }}
          files: ${{ steps.apk.outputs.path }}
          body: |
            limm VPN — персональный VPN, форк v2rayNG.
            Build: `${{ github.sha }}`
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Деплой на limm.space. Секрет DEPLOY_SSH_KEY — private key для deploy@45.95.175.170.
      - name: Upload APK to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: 45.95.175.170
          username: deploy
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          source: ${{ steps.apk.outputs.path }}
          target: /tmp/

      - name: Swap APK and update apk-info.json
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 45.95.175.170
          username: deploy
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            mv -f /tmp/${{ steps.apk.outputs.name }} /var/www/limm/vpn/limm-vpn.apk
            chmod 644 /var/www/limm/vpn/limm-vpn.apk
            echo '{"build":"${{ github.sha }}","version":"${{ inputs.version }}"}' \
              > /var/www/limm/vpn/apk-info.json
