name: Build & Release APK

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version name (e.g. 2.2.3.2). Must be > installed for update to trigger.'
        required: true
        default: '2.2.3.2'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      # Restore the SAME debug keystore so APK upgrades over existing installs work.
      # Secret DEBUG_KEYSTORE_BASE64: base64 of ~/.android/debug.keystore from the build machine.
      - name: Restore debug keystore
        run: |
          mkdir -p ~/.android
          echo "${{ secrets.DEBUG_KEYSTORE_BASE64 }}" | base64 -d > ~/.android/debug.keystore

      # Secrets required: LIMM_VLESS_UUID, LIMM_TOKEN, LIMM_REALITY_SID
      - name: Write limm.properties
        run: |
          {
            echo "LIMM_VLESS_UUID=${{ secrets.LIMM_VLESS_UUID }}"
            echo "LIMM_TOKEN=${{ secrets.LIMM_TOKEN }}"
            echo "LIMM_LABEL=mob"
            echo "LIMM_REALITY_SID=${{ secrets.LIMM_REALITY_SID }}"
            echo "LIMM_BUILD_SHA=${{ github.sha }}"
          } > V2rayNG/limm.properties

      # Override sdk.dir for Linux (ubuntu-latest has ANDROID_HOME pre-set, but local.properties
      # from Windows has a Windows path that confuses gradle).
      - name: Fix local.properties for Linux
        run: echo "sdk.dir=$ANDROID_HOME" > V2rayNG/local.properties

      - name: Set version
        run: |
          sed -i 's/versionName = "[^"]*"/versionName = "${{ inputs.version }}"/' \
            V2rayNG/app/build.gradle.kts
          # versionCode from version parts: 2.2.3.2 → 2020302 (M*1000000 + m*10000 + p*100 + b)
          IFS='.' read -r V1 V2 V3 V4 <<< "${{ inputs.version }}"
          VC=$(( ${V1:-0}*1000000 + ${V2:-0}*10000 + ${V3:-0}*100 + ${V4:-0} ))
          sed -i "s/versionCode = [0-9]*/versionCode = $VC/" \
            V2rayNG/app/build.gradle.kts

      # Install NDK needed to compile hev-socks5-tunnel
      - name: Install NDK
        run: |
          echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
            --channel=0 \
            --install "ndk;29.0.14206865"
          echo "NDK_HOME=$ANDROID_HOME/ndk/29.0.14206865" >> $GITHUB_ENV

      # Build libhev-socks5-tunnel .so files (arm64-v8a only for our release build)
      - name: Build libhevtun
        run: |
          mkdir -p /tmp/jni
          echo 'include $(call all-subdir-makefiles)' > /tmp/jni/Android.mk
          ln -s "${{ github.workspace }}/hev-socks5-tunnel" /tmp/jni/hev-socks5-tunnel
          "$NDK_HOME/ndk-build" \
            NDK_PROJECT_PATH=/tmp \
            APP_BUILD_SCRIPT=/tmp/jni/Android.mk \
            "APP_ABI=arm64-v8a" \
            APP_PLATFORM=android-24 \
            NDK_LIBS_OUT=/tmp/hev-libs \
            NDK_OUT=/tmp/hev-obj \
            "APP_CFLAGS=-O3 -DPKGNAME=com/v2ray/ang/service" \
            "APP_LDFLAGS=-Wl,--build-id=none -Wl,--hash-style=gnu"
          mkdir -p "${{ github.workspace }}/V2rayNG/app/libs/arm64-v8a"
          cp /tmp/hev-libs/arm64-v8a/libhev-socks5-tunnel.so \
            "${{ github.workspace }}/V2rayNG/app/libs/arm64-v8a/"

      # Download libv2ray.aar from AndroidLibXrayLite (pinned to v26.6.2 = matches local build)
      - name: Download libv2ray
        uses: robinraju/release-downloader@v1.13
        with:
          repository: '2dust/AndroidLibXrayLite'
          tag: 'v26.6.2'
          fileName: 'libv2ray.aar'
          out-file-path: V2rayNG/app/libs/

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build APK (arm64-v8a)
        working-directory: V2rayNG
        run: ./gradlew :app:assemblePlaystoreDebug -PABI_FILTERS=arm64-v8a --no-daemon

      - name: Locate APK
        id: apk
        run: |
          APK=$(find V2rayNG/app/build/outputs/apk -name '*.apk' | head -1)
          echo "path=$APK" >> $GITHUB_OUTPUT
          echo "name=$(basename $APK)" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version }}
          name: limm VPN v${{ inputs.version }}
          files: ${{ steps.apk.outputs.path }}
          body: |
            limm VPN — персональный VPN, форк v2rayNG.
            Build: `${{ github.sha }}`
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Flatten APK to workspace root so scp-action doesn't recreate subdirs on server.
      # (scp-action preserves the full relative path when source is deep in a tree.)
      - name: Flatten APK for upload
        run: cp "${{ steps.apk.outputs.path }}" limm-vpn-upload.apk

      # Deploy to limm.space. Secret DEPLOY_SSH_KEY: private key for deploy@45.95.175.170
      - name: Upload APK to server
        uses: appleboy/scp-action@v1.0.0
        with:
          host: 45.95.175.170
          username: deploy
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          source: limm-vpn-upload.apk
          target: /tmp/

      - name: Swap APK and update apk-info.json
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 45.95.175.170
          username: deploy
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            mv -f /tmp/limm-vpn-upload.apk /var/www/limm/vpn/limm-vpn.apk
            chmod 644 /var/www/limm/vpn/limm-vpn.apk
            # Versioned copy with short hash suffix; delete previous versioned files first
            SHORTHASH=$(echo "${{ github.sha }}" | cut -c37-40)
            find /var/www/limm/vpn -maxdepth 1 -name 'limm-vpn_*.apk' -delete
            cp /var/www/limm/vpn/limm-vpn.apk /var/www/limm/vpn/limm-vpn_${SHORTHASH}.apk
            echo "return 302 /vpn/limm-vpn_${SHORTHASH}.apk;" \
              > /var/www/limm/vpn/_app_redirect.conf
            sudo systemctl reload nginx
            echo '{"build":"${{ github.sha }}","version":"${{ inputs.version }}"}' \
              > /var/www/limm/vpn/apk-info.json
            mkdir -p /var/www/limm/vpn/releases
            echo '{"tag_name":"v${{ inputs.version }}","prerelease":false,"body":"limm VPN v${{ inputs.version }}","assets":[{"name":"limm-vpn_arm64-v8a.apk","browser_download_url":"https://limm.space/vpn/limm-vpn.apk"}]}' \
              > /var/www/limm/vpn/releases/latest
